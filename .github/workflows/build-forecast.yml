name: build-forecast
on:
  schedule:
    - cron: "23 */6 * * *"   # ~every 6h, offset from model publication times
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install eccodes system library (cfgrib backend)
        run: sudo apt-get update && sudo apt-get install -y libeccodes-data libeccodes0 || true

      - name: Install Python deps
        run: pip install -r pipeline/requirements.txt

      - name: Build forecast payload
        run: python pipeline/build_forecast.py

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r web/* _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
